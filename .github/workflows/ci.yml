name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Format
        run: terraform -chdir=infra/azure fmt -check -recursive
      - name: Initialize without remote state
        run: terraform -chdir=infra/azure init -backend=false
      - name: Validate
        run: terraform -chdir=infra/azure validate
      - name: Test mocked deployment plan
        run: terraform -chdir=infra/azure test

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

  ai-service:
    name: AI service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip==25.1.1 && python -m pip install -e ".[dev]"
      - name: Lint
        run: >-
          python -m ruff check src tests ../scripts/cloud_smoke_test.py
          ../scripts/observability_smoke_test.py ../scripts/validate_observability.py
          ../scripts/kubernetes_smoke_test.py ../scripts/validate_kubernetes.py
          ../observability/alert-sink/server.py
      - name: Test
        run: python -m pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  analytics:
    name: Analytics
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: serviceops
          POSTGRES_USER: serviceops
          POSTGRES_PASSWORD: serviceops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviceops -d serviceops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DBT_POSTGRES_HOST: localhost
      DBT_POSTGRES_PORT: "5432"
      DBT_POSTGRES_USER: serviceops
      DBT_POSTGRES_PASSWORD: serviceops_ci
      DBT_POSTGRES_DATABASE: serviceops
      ANALYTICS_DATABASE_URL: postgresql://serviceops:serviceops_ci@localhost:5432/serviceops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/pyproject.toml
      - name: Install analytics tooling
        working-directory: analytics
        run: python -m pip install --upgrade pip==25.1.1 && python -m pip install -e ".[dev]"
      - name: Lint fixture generator
        working-directory: analytics
        run: python -m ruff check src tests scripts
      - name: Test fixture generator
        working-directory: analytics
        run: python -m pytest
      - name: Apply operational migrations
        run: python analytics/scripts/apply_test_migrations.py
      - name: Generate 100,000 lifecycle events
        working-directory: analytics
        run: serviceops-generate-analytics
      - name: Build and test dbt models
        working-directory: analytics/dbt
        run: dbt build --profiles-dir .
      - name: Validate Power BI model sources and measures
        run: python analytics/scripts/validate_power_bi_model.py

  docker:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, ai-service, frontend, analytics, observability]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build all images
        run: docker compose --profile analytics build

  observability:
    name: Observability contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate source contracts
        run: python scripts/validate_observability.py
      - name: Validate Compose overlay
        run: docker compose -f compose.yaml -f compose.observability.yaml config --quiet
      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.13.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.13.0 check rules /etc/prometheus/rules/serviceops.yml
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.13.0 test rules /etc/prometheus/rule-tests.yml
      - name: Validate Alertmanager configuration
        run: >-
          docker run --rm -v "$PWD/observability/alertmanager:/etc/alertmanager"
          --entrypoint amtool prom/alertmanager:v0.32.1
          check-config /etc/alertmanager/alertmanager.yml
      - name: Validate OpenTelemetry Collector configuration
        run: >-
          docker run --rm -v "$PWD/observability:/etc/serviceops:ro"
          otel/opentelemetry-collector-contrib:0.152.0
          validate --config=/etc/serviceops/otel-collector.yaml
      - name: Validate Loki configuration
        run: >-
          docker run --rm -v "$PWD/observability/loki:/etc/loki:ro"
          grafana/loki:3.7.2
          --config.file=/etc/loki/loki.yaml --verify-config=true
      - name: Validate JSON and Python receiver
        run: |
          python -m json.tool observability/grafana/dashboards/serviceops-overview.json >/dev/null
          python -m py_compile observability/alert-sink/server.py

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl 1.36.2
        run: |
          curl --fail --location --silent --show-error --output kubectl \
            https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error --output kubectl.sha256 \
            https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
      - name: Validate source and rendered contracts
        run: python scripts/validate_kubernetes.py --kubectl "$PWD/kubectl"
      - name: Render overlays
        run: |
          ./kubectl kustomize k8s/overlays/local > /tmp/serviceops-local.yaml
          ./kubectl kustomize k8s/overlays/production > /tmp/serviceops-production.yaml
      - name: Install kubeconform 0.7.0
        run: |
          curl --fail --location --silent --show-error --output kubeconform-linux-amd64.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          curl --fail --location --silent --show-error --output CHECKSUMS \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/CHECKSUMS
          grep 'kubeconform-linux-amd64.tar.gz' CHECKSUMS | sha256sum --check
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
      - name: Validate Kubernetes 1.36 schemas
        run: >-
          ./kubeconform -strict -summary -kubernetes-version 1.36.0
          /tmp/serviceops-local.yaml /tmp/serviceops-production.yaml

  kubernetes-acceptance:
    name: Kubernetes browser and load acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [backend, ai-service, frontend, kubernetes]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install kind 0.32.0 and kubectl 1.36.2
        run: |
          curl --fail --location --silent --show-error --output kind-linux-amd64 \
            https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          curl --fail --location --silent --show-error --output kind.sha256sum \
            https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64.sha256sum
          sha256sum --check kind.sha256sum
          mv kind-linux-amd64 kind
          chmod +x kind
          curl --fail --location --silent --show-error --output kubectl \
            https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error --output kubectl.sha256 \
            https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
      - name: Run isolated Kubernetes quality gates
        run: >-
          python scripts/kubernetes_smoke_test.py
          --kind "$PWD/kind" --kubectl "$PWD/kubectl" --quality-gates
      - name: Upload browser and load evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: kubernetes-quality-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            performance/results/
          if-no-files-found: ignore
          retention-days: 14
