name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Format
        run: terraform -chdir=infra/azure fmt -check -recursive
      - name: Initialize without remote state
        run: terraform -chdir=infra/azure init -backend=false
      - name: Validate
        run: terraform -chdir=infra/azure validate
      - name: Test mocked deployment plan
        run: terraform -chdir=infra/azure test

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

  ai-service:
    name: AI service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip==25.1.1 && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests ../scripts/cloud_smoke_test.py
      - name: Test
        run: python -m pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  analytics:
    name: Analytics
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: serviceops
          POSTGRES_USER: serviceops
          POSTGRES_PASSWORD: serviceops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviceops -d serviceops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DBT_POSTGRES_HOST: localhost
      DBT_POSTGRES_PORT: "5432"
      DBT_POSTGRES_USER: serviceops
      DBT_POSTGRES_PASSWORD: serviceops_ci
      DBT_POSTGRES_DATABASE: serviceops
      ANALYTICS_DATABASE_URL: postgresql://serviceops:serviceops_ci@localhost:5432/serviceops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/pyproject.toml
      - name: Install analytics tooling
        working-directory: analytics
        run: python -m pip install --upgrade pip==25.1.1 && python -m pip install -e ".[dev]"
      - name: Lint fixture generator
        working-directory: analytics
        run: python -m ruff check src tests scripts
      - name: Test fixture generator
        working-directory: analytics
        run: python -m pytest
      - name: Apply operational migrations
        run: python analytics/scripts/apply_test_migrations.py
      - name: Generate 100,000 lifecycle events
        working-directory: analytics
        run: serviceops-generate-analytics
      - name: Build and test dbt models
        working-directory: analytics/dbt
        run: dbt build --profiles-dir .
      - name: Validate Power BI model sources and measures
        run: python analytics/scripts/validate_power_bi_model.py

  docker:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, ai-service, frontend, analytics]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build all images
        run: docker compose --profile analytics build
