[build-system]
requires = ["setuptools==80.3.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "serviceops-ai"
version = "0.1.0"
description = "Deterministic ServiceOps ticket prediction service"
requires-python = ">=3.12,<3.14"
dependencies = [
    "confluent-kafka==2.8.2",
    "fastapi==0.115.12",
    "joblib==1.4.2",
    "jsonschema==4.23.0",
    "pandas==2.2.3",
    "pydantic==2.11.4",
    "scikit-learn==1.6.1",
    "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "ruff==0.11.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
