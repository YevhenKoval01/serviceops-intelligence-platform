spring:
  application:
    name: serviceops-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/serviceops}
    username: ${SPRING_DATASOURCE_USERNAME:serviceops}
    password: ${SPRING_DATASOURCE_PASSWORD:serviceops_dev}
    hikari:
      connection-timeout: 10000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    admin:
      fail-fast: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        delivery.timeout.ms: 15000
        enable.idempotence: true
        request.timeout.ms: 10000
    consumer:
      group-id: serviceops-backend-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      missing-topics-fatal: true
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s

serviceops:
  auth:
    issuer: ${SERVICEOPS_AUTH_ISSUER:serviceops-local}
    audience: ${SERVICEOPS_AUTH_AUDIENCE:serviceops-api}
    token-ttl: ${SERVICEOPS_AUTH_TOKEN_TTL:15m}
    jwt-secret: ${SERVICEOPS_AUTH_JWT_SECRET:local-development-signing-key-change-me-2026}
    bootstrap:
      enabled: ${SERVICEOPS_AUTH_BOOTSTRAP_ENABLED:true}
      operator-username: ${SERVICEOPS_AUTH_OPERATOR_USERNAME:operator}
      operator-password: ${SERVICEOPS_AUTH_OPERATOR_PASSWORD:operator_dev_2026}
      viewer-username: ${SERVICEOPS_AUTH_VIEWER_USERNAME:viewer}
      viewer-password: ${SERVICEOPS_AUTH_VIEWER_PASSWORD:viewer_dev_2026}
  topics:
    ticket-created: serviceops.ticket.created.v1
    prediction-completed: serviceops.ticket.prediction-completed.v1
    invalid: serviceops.ticket.invalid.v1
  outbox:
    enabled: ${SERVICEOPS_OUTBOX_ENABLED:true}
    poll-interval-ms: ${SERVICEOPS_OUTBOX_POLL_INTERVAL_MS:500}
    initial-delay-ms: ${SERVICEOPS_OUTBOX_INITIAL_DELAY_MS:1000}
    batch-size: ${SERVICEOPS_OUTBOX_BATCH_SIZE:25}
    send-timeout-ms: ${SERVICEOPS_OUTBOX_SEND_TIMEOUT_MS:10000}
    initial-backoff-ms: ${SERVICEOPS_OUTBOX_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${SERVICEOPS_OUTBOX_MAX_BACKOFF_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  error:
    include-message: never
