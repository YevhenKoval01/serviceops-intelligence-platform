name: serviceops-intelligence-platform

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serviceops}
      POSTGRES_USER: ${POSTGRES_USER:-serviceops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serviceops_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - serviceops

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://kafka:9092,external://localhost:19092
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 18
    networks:
      - serviceops

  backend:
    init: true
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-serviceops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-serviceops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-serviceops_dev}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICEOPS_AUTH_ISSUER: ${SERVICEOPS_AUTH_ISSUER:-serviceops-local}
      SERVICEOPS_AUTH_AUDIENCE: ${SERVICEOPS_AUTH_AUDIENCE:-serviceops-api}
      SERVICEOPS_AUTH_JWT_SECRET: ${SERVICEOPS_AUTH_JWT_SECRET:-local-development-signing-key-change-me-2026}
      SERVICEOPS_AUTH_OPERATOR_USERNAME: ${SERVICEOPS_AUTH_OPERATOR_USERNAME:-operator}
      SERVICEOPS_AUTH_OPERATOR_PASSWORD: ${SERVICEOPS_AUTH_OPERATOR_PASSWORD:-operator_dev_2026}
      SERVICEOPS_AUTH_VIEWER_USERNAME: ${SERVICEOPS_AUTH_VIEWER_USERNAME:-viewer}
      SERVICEOPS_AUTH_VIEWER_PASSWORD: ${SERVICEOPS_AUTH_VIEWER_PASSWORD:-viewer_dev_2026}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    stop_grace_period: 20s
    networks:
      - serviceops

  ai-service:
    init: true
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      MODEL_PATH: /app/model/serviceops-baseline.joblib
      SERVICEOPS_AUTH_ISSUER: ${SERVICEOPS_AUTH_ISSUER:-serviceops-local}
      SERVICEOPS_AUTH_AUDIENCE: ${SERVICEOPS_AUTH_AUDIENCE:-serviceops-api}
      SERVICEOPS_AUTH_JWT_SECRET: ${SERVICEOPS_AUTH_JWT_SECRET:-local-development-signing-key-change-me-2026}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - ai-model:/app/model
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 25s
    stop_grace_period: 20s
    networks:
      - serviceops

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_SCHEME: http
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - serviceops

  analytics:
    profiles: ["analytics"]
    build:
      context: ./analytics
    environment:
      DBT_POSTGRES_HOST: postgres
      DBT_POSTGRES_PORT: "5432"
      DBT_POSTGRES_USER: ${POSTGRES_USER:-serviceops}
      DBT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serviceops_dev}
      DBT_POSTGRES_DATABASE: ${POSTGRES_DB:-serviceops}
      ANALYTICS_DATABASE_URL: postgresql://${POSTGRES_USER:-serviceops}:${POSTGRES_PASSWORD:-serviceops_dev}@postgres:5432/${POSTGRES_DB:-serviceops}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - serviceops

volumes:
  postgres-data:
  ai-model:

networks:
  serviceops:
    driver: bridge
