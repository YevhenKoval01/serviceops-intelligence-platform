apiVersion: v1
kind: ConfigMap
metadata:
  name: serviceops-config
data:
  POSTGRES_DB: serviceops
  POSTGRES_USER: serviceops
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/serviceops
  SPRING_DATASOURCE_USERNAME: serviceops
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_ENABLED: "true"
  MODEL_PATH: /app/model/serviceops-baseline.joblib
  SERVICEOPS_AUTH_ISSUER: serviceops-kubernetes
  SERVICEOPS_AUTH_AUDIENCE: serviceops-api
  SERVICEOPS_AUTH_OPERATOR_USERNAME: operator
  SERVICEOPS_AUTH_VIEWER_USERNAME: viewer
  BACKEND_SCHEME: http
  BACKEND_HOST: backend
  BACKEND_PORT: "8080"
  AI_SCHEME: http
  AI_HOST: ai-service
  AI_PORT: "8000"
  OTEL_SDK_DISABLED: "true"
