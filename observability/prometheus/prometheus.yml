global:
  scrape_interval: 5s
  evaluation_interval: 10s
  external_labels:
    deployment_environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: serviceops-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8080]

  - job_name: serviceops-ai-service
    metrics_path: /metrics
    static_configs:
      - targets: [ai-service:8000]

  - job_name: serviceops-otel-collector
    static_configs:
      - targets: [otel-collector:9464]

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
